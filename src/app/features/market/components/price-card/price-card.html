@let a = asset();
@let loading = isLoading();

<mat-card appearance="outlined" [class.highlighted]="highlight()">
  @if (loading) {
    <mat-card-content class="animate-pulse">
      <div class="h-6 w-1/2 rounded bg-slate-300"></div>
      <div class="mt-4 h-5 rounded bg-slate-300"></div>
    </mat-card-content>
  } @else {
    <mat-card-content class="relative">
      <div>{{ a?.name }}</div>
      <div class="mt-1 text-2xl">
        {{ a?.priceUsd | currency: 'EUR' : 'symbol' : '1.2-2' }}
      </div>

      @if (highlight()) {
        <span
          class="absolute right-2 bottom-2 rounded-full bg-amber-100 px-2 py-1 text-xs text-amber-900"
        >
          🐶 much wow
        </span>
      }
    </mat-card-content>
  }
</mat-card>
