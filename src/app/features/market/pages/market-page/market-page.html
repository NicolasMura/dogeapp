@let assets = assets$ | async;

<section class="grid gap-6">
  <div class="flex items-end justify-between gap-4">
    <div>
      <h1 class="text-3xl">Market overview</h1>
      <p class="mt-1 text-sm text-slate-500">
        BTC, ETH and DOGE. Very serious finance. Much professional.
      </p>
    </div>

    <button matButton="outlined" (click)="reload()">Rafraîchir</button>
  </div>

  @if (isLoading() && !assets?.length) {
    <mat-progress-spinner mode="indeterminate" diameter="50" class="mx-auto"></mat-progress-spinner>
  }

  <div class="grid grid-cols-1 gap-4 md:grid-cols-3">
    @for (asset of assets; track asset.id) {
      <doge-price-card
        [asset]="asset"
        [highlight]="asset.id === 'dogecoin'"
        [isLoading]="isLoading()"
      ></doge-price-card>
    }
  </div>
</section>
