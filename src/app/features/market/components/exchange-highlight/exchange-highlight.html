@let e = exchange();
@let loading = isLoading();

<div class="rounded-2xl border border-amber-200 bg-amber-50 p-5">
  <div class="flex items-start justify-between gap-4">
    <div>
      <div class="text-sm text-amber-900">🏆 Top exchange (24h volume)</div>

      @if (loading) {
        <div class="mt-2 h-6 w-1/3 animate-pulse rounded bg-slate-300"></div>
        <div class="mt-1 h-5 w-full animate-pulse rounded bg-slate-300"></div>
      } @else {
        <div class="mt-1 text-xl text-slate-900">{{ e?.name ?? '—' }}</div>
        <div class="mt-1 text-sm text-slate-600 tabular-nums">
          Volume (24h): {{ e?.volumeUsd | currency: 'EUR' : 'symbol' : '1.2-2' }}
        </div>
      }
    </div>

    <div class="rounded-xl bg-white px-3 py-2 text-xs text-amber-900">such liquidity</div>
  </div>
</div>
